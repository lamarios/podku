server:
  # tomcat:
  #   threads:
  #     max: 8
  port: 8080
podku:
  episodes:
    cache-dir: ${EPISODE_CACHE_DIR:./episode-cache}
    cache-count: ${EPISODE_CACHE_COUNT:0}
whisper:
  url: ${WHISPER_URL}
  model: ${WHISPER_MODEL:base}
  apiKey: ${WHISPER_API_KEY}
  episodeProcessCount: ${WHISPER_EPISODE_PROCESS_COUNT:0}
spring:
  mvc:
    async:
      request-timeout: -1
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8090}/${DB_DATABASE:podku}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:o1HC88oNaNCxtIy1Sc6mzDtTormrmBRC}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  # jpa:
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       format_sql: true
logging:
  level:
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.flywaydb: DEBUG