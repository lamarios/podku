name: Build backend
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    tags:
      - '*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Web and backend
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set default version
        id: set_base_version
        run: |
          echo "TAG_NAME=0.0.1" >> $GITHUB_ENV
      - name: Extract tag name
        id: extract_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG_NAME=${TAG:-1.0.0}" >> $GITHUB_ENV
      # Build web app
      - name: Build version
        run: echo "Building web ${TAG_NAME}:${{ github.run_number }}"
      - name: build web
        working-directory: ./src/main/app
        run: |
          nix-shell --run "flutter build web --release --build-name ${TAG_NAME} --build-number ${{ github.run_number }} --wasm -o ../resources/public" ../../../shell.nix
      # build backend
      - name: Build version
        run: echo "Building backend ${{ github.run_number }}"
      - name: Set application version
        run: |
          nix-shell --run "mvn versions:set -DnewVersion=${{ github.run_number }}"
          nix-shell --run "mvn versions:commit"
      - name: Build Java app
        run: nix-shell --run "mvn clean install"
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/podku:${{ github.run_number }}
      - name: Build and push Docker image (Release)
        uses: docker/build-push-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/podku:latest
            ${{ secrets.DOCKER_USERNAME }}/podku:${{ env.TAG_NAME }}