name: Build flatpak
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    tags:
      - '*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Flatpak
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Set default version
        id: set_base_version
        run: |
          echo "TAG_NAME=0.0.1" >> $GITHUB_ENV
      - name: Extract tag name
        id: extract_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG_NAME=${TAG:-1.0.0}" >> $GITHUB_ENV
      - name: Allow unprivileged user namespaces
        # flatpak-builder sandboxes the build with bubblewrap, which ubuntu's apparmor blocks for binaries coming from nix
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build flatpak
        run: |
          export APP_VERSION=${TAG_NAME}
          export BUILD_NUMBER=${{ github.run_number }}
          echo "Building podku flatpak ${APP_VERSION}+${BUILD_NUMBER}"
          nix-shell --run "make flatpak"
          mv flatpak/podku.flatpak flatpak/podku-${APP_VERSION}-x86_64.flatpak
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podku-x86_64.flatpak
          path: flatpak/podku-*.flatpak
      - name: Upload flatpak to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          file: flatpak/podku-*.flatpak
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  publish-repo:
    name: Publish flatpak repository
    # Adds the release to the flatpak repository in docs/flatpak, served by GitHub pages, so users installing
    # through docs/flatpak/podku.flatpakref get updates
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: podku-x86_64.flatpak
          path: bundle
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
      - name: Import signing key
        # FLATPAK_GPG_PRIVATE_KEY is an armored private key without passphrase (gpg --armor --export-secret-keys <id>)
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 $GNUPGHOME
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> $GITHUB_ENV
      - name: Update repository
        run: flatpak/publish-repo.sh bundle/podku-*.flatpak "$GPG_KEY_ID"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.nojekyll docs/flatpak
          git commit -m "publish flatpak ${GITHUB_REF#refs/tags/}"
          # the bump version workflow pushes to main at the same time
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
