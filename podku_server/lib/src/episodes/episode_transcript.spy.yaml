class: EpisodeTranscript
table: episode_transcripts
fields:
  id: UuidValue, defaultModel=random
  startTime: String
  endTime: String
  speaker: String?
  content: String
  language: String?
  episode: Episode?, relation(name=episode_transcript, onDelete=cascade)
indexes:
  episode_language_idx:
    fields: language, episodeId
